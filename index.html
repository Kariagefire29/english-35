
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ミラクル英語35">
<meta name="theme-color" content="#2563eb">
<link rel="apple-touch-icon" href="IMG_8536.jpeg">
<title>ミラクル英語35</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7fb;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:700px;margin:auto;padding:18px 14px 40px}
h1{text-align:center;font-size:24px;margin:6px}
.sub{text-align:center;color:#6b7280;font-size:13px;margin-bottom:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:9px 0}
button,select{font:inherit;border:1px solid #e5e7eb;border-radius:13px;background:#fff;padding:13px;font-weight:800;width:100%}
button:active{opacity:.75}
.active,.blue{background:#2563eb;color:#fff;border-color:#2563eb}
.card{min-height:345px;background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:22px 18px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.count{font-size:13px;color:#6b7280;margin-bottom:15px}
.q{font-size:clamp(25px,7vw,39px);font-weight:850;line-height:1.35}
.example{font-size:clamp(16px,4.4vw,21px);line-height:1.55;color:#4b5563;margin-top:18px;white-space:pre-line}
.ans{display:none;width:100%;border-top:1px solid #e5e7eb;margin-top:22px;padding-top:18px}
.ans.show{display:block}
.answerMain{font-size:clamp(20px,5.5vw,29px);font-weight:800}
.answerEx{font-size:clamp(16px,4.4vw,21px);color:#4b5563;margin-top:13px;line-height:1.55;white-space:pre-line}
.rhythm{margin-top:12px;padding:17px;font-size:20px;background:#2563eb;color:#fff;border-color:#2563eb}
#quiz{display:none}
.choices{display:grid;gap:9px;margin-top:12px}
.choice{text-align:left}
.correct{outline:3px solid #86efac;background:#dcfce7}
.wrong{outline:3px solid #fca5a5;background:#fee2e2}
.small{text-align:center;margin-top:14px;font-size:12px;color:#6b7280}
</style>
</head>
<body>
<main class="app">
<h1>ミラクル英語35</h1>
<div class="sub">同じボタンをポンポン押して進める</div>

<div class="grid">
<button id="flashTab" class="active">📚 暗記カード</button>
<button id="quizTab">🧠 4択クイズ</button>
</div>

<div class="grid">
<select id="direction">
<option value="en-ja">英語 → 日本語</option>
<option value="ja-en">日本語 → 英語</option>
</select>
<button id="shuffle">🔀 完全シャッフル</button>
</div>

<section id="flash">
<div class="card">
<div class="count" id="count"></div>
<div class="q" id="question"></div>
<div class="example" id="example"></div>
<div class="ans" id="answerBox">
<div class="answerMain" id="answer"></div>
<div class="answerEx" id="answerExample"></div>
</div>
</div>
<button class="rhythm" id="rhythm">答えを見る</button>
<div class="grid">
<button id="prev">← 前</button>
<button id="speak">🔊 英語を聞く</button>
</div>
</section>

<section id="quiz">
<div class="card" style="min-height:230px">
<div class="count" id="quizCount"></div>
<div class="q" id="quizQuestion"></div>
<div class="example" id="quizExample"></div>
</div>
<div class="choices" id="choices"></div>
<div class="grid">
<button id="newQuiz">次の問題</button>
<button id="quizSpeak">🔊 英語を聞く</button>
</div>
<div class="small" id="quizScore"></div>
</section>

<div class="small">クイズ成績はSafariに保存されます</div>
</main>

<script>
const cards=[
["I want to do","～したい","I want to watch a movie tonight.","今夜、映画を見たい。"],
["I don’t want to do","～したくない","I don't want to go out today.","今日は外出したくない。"],
["I’m going to do","～するつもり／～する予定","I'm going to study English tonight.","今夜、英語を勉強するつもりです。"],
["I’m not going to do","～するつもりはない","I'm not going to buy it.","それを買うつもりはありません。"],
["I’ve gotta do / I have to do","～しなければならない","I've gotta get up early tomorrow.\nI have to work tomorrow.","明日は早く起きなければならない。\n明日は働かなければならない。"],
["I think (that) 文","～だと思う","I think he's right.\nI think that she's kind.","彼は正しいと思う。\n彼女は親切だと思う。"],
["I don’t think (that) 文","～だとは思わない","I don't think it's expensive.\nI don't think that he'll come.","それは高いとは思わない。\n彼が来るとは思わない。"],
["I feel like 文","～な気がする","I feel like it's going to rain.","雨が降りそうな気がする。"],
["I don’t know if 文","～かどうかわからない","I don't know if he's coming.","彼が来るかどうかわからない。"],
["文, but 文","～だけど、～","I'm tired, but I want to go.","疲れているけど、行きたい。"],
["文, and 文","～、そして～","I got home, and I took a shower.","家に帰って、シャワーを浴びた。"],
["文, and then 文","～、それから～","I ate dinner, and then I watched TV.","夕食を食べて、それからテレビを見た。"],
["文, so 文","～、だから～","I was tired, so I went to bed.","疲れていたので、寝た。"],
["So, 文","だから、～","So, I decided to stay home.","だから、家にいることにした。"],
["文 once 文 / Once 文, 文","～したら／いったん～すると","I'll call you once I get home.\nOnce I get home, I'll call you.","家に着いたら電話するよ。\n家に着いたら電話するよ。"],
["文 when 文 / When 文, 文","～するとき","Call me when you get home.\nWhen I got home, I was tired.","家に着いたら電話して。\n家に帰ったとき、疲れていた。"],
["文 because 文 / Because 文, 文","～だから／～なので","I stayed home because it was raining.\nBecause it was raining, I stayed home.","雨が降っていたので家にいた。\n雨が降っていたので家にいた。"],
["文 until / till 文","～するまで","I'll wait until you come back.\nI'll stay here till you return.","あなたが戻るまで待つよ。\nあなたが戻るまでここにいるよ。"],
["文 if 文 / If 文, 文","もし～なら","I'll stay home if it rains.\nIf it rains, I'll stay home.","雨が降ったら家にいるよ。\nもし雨が降ったら、家にいるよ。"],
["I would do if 過去形 / If 過去形, I would do","もし～なら、～するのに","I would travel if I had more time.\nIf I had more time, I would travel.","もっと時間があれば旅行するのに。\nもっと時間があれば旅行するのに。"],
["I would say (that) 文","～だと思う／～と言えるかな","I would say it's pretty good.\nI would say that he's honest.","かなりいいと思うよ。\n彼は正直だと言えるかな。"],
["I would do","～するだろう／～するのにな","I would choose this one.","私ならこれを選ぶよ。"],
["let A do","Aに～させる","Let me help you.","私に手伝わせて。"],
["make A do / 形容詞 / 過去分詞","Aに～させる／Aを～の状態にする","That movie made me cry.\nThe news made me happy.\nI made myself understood.","その映画を見て泣いた。\nその知らせは私を幸せにした。\n私は自分の言いたいことを理解してもらった。"],
["have A do / 形容詞 / 過去分詞 / doing","Aに～してもらう／Aを～の状態にする","I'll have him call you.\nI'll have everything ready.\nI had my hair cut.\nI had the engine running.","彼にあなたへ電話してもらいます。\nすべて準備ができた状態にします。\n髪を切ってもらいました。\nエンジンをかけたままにしていました。"],
["get A to do / 形容詞 / 過去分詞 / doing","Aに～してもらう／Aを～の状態にする","I got him to help me.\nI got everything ready.\nI got my car repaired.\nI got the machine working.","彼に手伝ってもらった。\nすべて準備しました。\n車を修理してもらいました。\n機械を動く状態にしました。"],
["see A do / doing / 形容詞 / 過去分詞","Aが～するのを見る／Aが～しているのを見る","I saw him cross the street.\nI saw him crossing the street.\nI saw him happy.\nI saw the door closed.","彼が通りを渡るのを見た。\n彼が通りを渡っているところを見た。\n彼が幸せそうなのを見た。\nドアが閉まっているのを見た。"],
["what + 主語 + 動詞 / 動詞 / is + 形容詞","～すること／もの","I know what you mean.\nI don't know what to do.\nWhat is important is your health.","あなたの言いたいことはわかる。\n何をすればいいかわからない。\n大切なのはあなたの健康です。"],
["A that + (主語) + 動詞","（～する）A","This is the book that I bought.\nI know a man that lives here.","これは私が買った本です。\nここに住んでいる男性を知っています。"],
["文, which + (主語) + 動詞","～、そしてそれは…／～、そのことは…","He was late, which surprised me.\nI bought a car, which is very fast.","彼は遅刻した。それには驚いた。\n車を買ったが、それはとても速い。"],
["you know","ほら／あのさ／わかるでしょ","It's hard, you know.","難しいんだよ、わかるでしょ。"],
["like","～みたいな／例えば","I like sports, like baseball.","野球みたいなスポーツが好きです。"],
["It’s like + 名詞 / , 文","～みたいなもの／なんていうか～","It's like a dream.\nIt's like, I can't explain it.","夢みたいだ。\nなんていうか、うまく説明できない。"],
["I’m like, 文","私は「～」って感じで／「～」って思って",'I\'m like, "No way!"',"私は「まさか！」って感じだった。"],
["I mean, 文","つまり／というか／要するに","I mean, it's not that bad.","つまり、そこまで悪くないよ。"]
];

const N=cards.length;
let order=Array.from({length:N},(_,i)=>i);
let pos=0;
let revealed=false;
let qa=0;
let locked=false;
let qc=0;
let qt=0;

const $=id=>document.getElementById(id);

try{
 qc=Number(localStorage.getItem("e35qc")||0)||0;
 qt=Number(localStorage.getItem("e35qt")||0)||0;
}catch(e){
 qc=0;
 qt=0;
}

function saveScore(){
 try{
  localStorage.setItem("e35qc",String(qc));
  localStorage.setItem("e35qt",String(qt));
 }catch(e){}
}

function render(){
 const i=order[pos];
 const d=$("direction").value;
 revealed=false;
 $("count").textContent=(pos+1)+" / "+N;
 $("question").textContent=d==="en-ja"?cards[i][0]:cards[i][1];
 $("example").textContent=d==="en-ja"?cards[i][2]:cards[i][3];
 $("answer").textContent=d==="en-ja"?cards[i][1]:cards[i][0];
 $("answerExample").textContent=d==="en-ja"?cards[i][3]:cards[i][2];
 $("answerBox").classList.remove("show");
 $("rhythm").textContent="答えを見る";
}

function next(){
 pos=(pos+1)%N;
 render();
}

function prev(){
 pos=(pos+N-1)%N;
 render();
}

function rhythm(){
 if(!revealed){
  revealed=true;
  $("answerBox").classList.add("show");
  $("rhythm").textContent="次へ →";
 }else{
  next();
 }
}

function shuffle(){
 for(let i=N-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [order[i],order[j]]=[order[j],order[i]];
 }
 pos=0;
 render();
 if($("quiz").style.display==="block")quiz();
}

function speak(i){
 if(!("speechSynthesis" in window))return;
 const u=new SpeechSynthesisUtterance(cards[i][2].split("\n")[0]);
 u.lang="en-US";
 speechSynthesis.cancel();
 speechSynthesis.speak(u);
}

function quiz(){
 locked=false;
 qa=Math.floor(Math.random()*N);
 const d=$("direction").value;
 $("quizQuestion").textContent=d==="en-ja"?cards[qa][0]:cards[qa][1];
 $("quizExample").textContent=d==="en-ja"?cards[qa][2]:cards[qa][3];
 $("quizCount").textContent="4択 ・ "+(d==="en-ja"?"英語 → 日本語":"日本語 → 英語");

 const pool=Array.from({length:N},(_,i)=>i).filter(i=>i!==qa);
 for(let i=pool.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [pool[i],pool[j]]=[pool[j],pool[i]];
 }
 const options=[qa,...pool.slice(0,3)];
 for(let i=options.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [options[i],options[j]]=[options[j],options[i]];
 }

 $("choices").innerHTML="";
 options.forEach(i=>{
  const b=document.createElement("button");
  b.className="choice";
  b.textContent=d==="en-ja"?cards[i][1]:cards[i][0];
  b.onclick=()=>check(i,b);
  $("choices").appendChild(b);
 });
 score();
}

function check(i,b){
 if(locked)return;
 locked=true;
 qt++;
 const d=$("direction").value;
 if(i===qa){
  qc++;
  b.classList.add("correct");
 }else{
  b.classList.add("wrong");
  const correct=d==="en-ja"?cards[qa][1]:cards[qa][0];
  Array.from($("choices").children).forEach(x=>{
   if(x.textContent===correct)x.classList.add("correct");
  });
 }
 saveScore();
 score();
}

function score(){
 $("quizScore").textContent="クイズ成績："+qc+" / "+qt+" 正解"+
 (qt?"（"+Math.round(qc/qt*100)+"%）":"");
}

$("rhythm").onclick=rhythm;
$("prev").onclick=prev;
$("shuffle").onclick=shuffle;
$("speak").onclick=()=>speak(order[pos]);
$("quizSpeak").onclick=()=>speak(qa);
$("direction").onchange=()=>{
 render();
 if($("quiz").style.display==="block")quiz();
};
$("flashTab").onclick=()=>{
 $("flash").style.display="block";
 $("quiz").style.display="none";
 $("flashTab").classList.add("active");
 $("quizTab").classList.remove("active");
};
$("quizTab").onclick=()=>{
 $("flash").style.display="none";
 $("quiz").style.display="block";
 $("quizTab").classList.add("active");
 $("flashTab").classList.remove("active");
 quiz();
};
$("newQuiz").onclick=quiz;

render();
score();
</script>
</body>
</html>
